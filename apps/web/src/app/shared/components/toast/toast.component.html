<div
  class="fixed bottom-4 right-4 z-[100] flex flex-col gap-3 w-80 max-w-[calc(100vw-2rem)] pointer-events-none"
  aria-live="polite"
  aria-atomic="false"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="bg-white border-2 border-black neo-shadow flex items-stretch overflow-hidden pointer-events-auto animate-toast-in"
      role="alert"
    >
      <div class="w-1.5 flex-shrink-0" [class]="colorClass(toast.type)"></div>

      <div class="flex-1 px-3 py-2.5 flex items-start justify-between gap-2">
        <div class="flex items-start gap-2">
          <span class="text-base leading-none mt-0.5 select-none">{{ icon(toast.type) }}</span>
          <p class="text-sm font-headline font-bold text-black leading-snug">{{ toast.message }}</p>
        </div>

        <button
          (click)="toastService.dismiss(toast.id)"
          class="flex-shrink-0 w-5 h-5 flex items-center justify-center border-2 border-black hover:bg-black hover:text-white transition-colors text-black font-black text-xs leading-none"
          aria-label="Fechar notificação"
        >
          ✕
        </button>
      </div>
    </div>
  }
</div>
