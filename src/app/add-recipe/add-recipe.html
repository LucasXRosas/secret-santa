<div class="add-recipe-container">
  <div class="header">
    <a routerLink="/recipes" class="back-link">← Back</a>
    <h2>Add New Recipe</h2>
  </div>

  <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="recipe-form">
    <div class="form-group">
      <label for="name">Recipe Name</label>
      <input id="name" type="text" formControlName="name" placeholder="e.g. Avocado Toast" />
      @if (recipeForm.get('name')?.invalid && recipeForm.get('name')?.touched) {
        <span class="error-msg">Name is required</span>
      }
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" rows="3" placeholder="Describe your recipe..."></textarea>
      @if (recipeForm.get('description')?.invalid && recipeForm.get('description')?.touched) {
        <span class="error-msg">Description is required</span>
      }
    </div>

    <div class="form-group">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty" formControlName="difficulty">
        <option value="facil">Fácil</option>
        <option value="medio">Médio</option>
        <option value="dificil">Difícil</option>
      </select>
    </div>

    <button type="submit" [disabled]="recipeForm.invalid" class="submit-btn">Save Recipe</button>
  </form>
</div>
