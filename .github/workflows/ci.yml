name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase db start

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        # Utiliza --watch=false para rodar apenas uma vez. 
        # Como o projeto usa Vitest com JSDOM (identificado no package.json), 
        # os testes já são executados em ambiente headless por padrão.
        run: npm run test -- --watch=false
